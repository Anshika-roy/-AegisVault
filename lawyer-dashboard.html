<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e40af" />
  <meta name="description" content="Manage incoming legal requests" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AegisVault" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231e40af' width='100' height='100' rx='20'/><text x='50' y='55' text-anchor='middle' font-size='50' font-weight='bold' fill='white' font-family='Arial'>AV</text></svg>" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./app.css" />
  <title>Lawyer Dashboard - AegisVault</title>
  <style>
    body {
      background:
        radial-gradient(900px 360px at 0% -15%, #e9f8f0 0%, transparent 60%),
        radial-gradient(900px 360px at 100% -20%, #eef5ff 0%, transparent 62%),
        var(--gray-50);
    }

    .dashboard-header {
      background: linear-gradient(145deg, #0f4cd6, #2b6dff);
      color: var(--white);
      padding: var(--spacing-2xl) var(--spacing-lg);
      margin-bottom: var(--spacing-2xl);
      border-radius: 0 0 22px 22px;
      box-shadow: 0 18px 34px rgba(15, 76, 214, 0.22);
    }

    .dashboard-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: var(--spacing-md);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: var(--spacing-lg);
      margin-bottom: var(--spacing-2xl);
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.75);
      padding: var(--spacing-lg);
      border-radius: 18px;
      box-shadow: var(--shadow-md);
      text-align: center;
      transition: var(--transition);
    }

    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: #0f4cd6;
    }

    .stat-label {
      font-size: 0.875rem;
      color: var(--gray-600);
      margin-top: var(--spacing-xs);
    }

    .request-card {
      background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
      border-radius: 16px;
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-lg);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.06);
      border-left: 4px solid #0f4cd6;
      border: 1px solid #e5edf8;
      transition: var(--transition);
    }

    .request-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .request-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: var(--spacing-md);
    }

    .request-client {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--gray-900);
    }

    .request-status {
      display: inline-block;
      padding: var(--spacing-xs) var(--spacing-sm);
      border-radius: var(--radius-md);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-pending {
      background: rgba(245, 158, 11, 0.1);
      color: #78350f;
    }

    .status-accepted {
      background: rgba(16, 185, 129, 0.1);
      color: #065f46;
    }

    .status-rejected {
      background: rgba(239, 68, 68, 0.1);
      color: #7f1d1d;
    }

    .request-time {
      font-size: 0.875rem;
      color: var(--gray-600);
      margin-bottom: var(--spacing-md);
    }

    .request-description {
      background: linear-gradient(180deg, #f7faff 0%, #f3f8ff 100%);
      padding: var(--spacing-md);
      border-radius: var(--radius-md);
      margin-bottom: var(--spacing-md);
      color: var(--gray-700);
      border: 1px solid #e3ecfb;
    }

    .request-actions {
      display: flex;
      gap: var(--spacing-md);
      flex-wrap: wrap;
    }

    .empty-state {
      text-align: center;
      padding: var(--spacing-2xl) var(--spacing-lg);
      background: #ffffff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      border: 1px solid #e6edf8;
    }

    .empty-icon {
      font-size: 3rem;
      margin-bottom: var(--spacing-lg);
    }

    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid #dde7f5;
      margin-bottom: var(--spacing-2xl);
      background: linear-gradient(180deg, rgba(243, 248, 255, 0.8), rgba(255, 255, 255, 0.6));
      padding: 0 var(--spacing-lg);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }

    .tab-btn {
      padding: var(--spacing-lg);
      background: none;
      border: none;
      font-size: 1rem;
      font-weight: 500;
      color: var(--gray-600);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: var(--transition);
    }

    .tab-btn:hover {
      color: #0f4cd6;
    }

    .tab-btn.active {
      color: #0f4cd6;
      border-bottom-color: #0f4cd6;
      background: linear-gradient(180deg, #f6f9ff 0%, #ffffff 100%);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    @media (max-width: 768px) {
      .request-actions {
        flex-direction: column;
      }

      .request-actions .btn {
        width: 100%;
      }

      .request-header {
        flex-direction: column;
        gap: var(--spacing-md);
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="./index.html" class="navbar-brand">⚖️ AegisVault</a>
      <ul class="navbar-nav">
        <li><a href="./lawyer-dashboard.html">Dashboard</a></li>
        <li>
          <button id="install-button" class="btn btn-sm" style="display: none;">📲 Install</button>
        </li>
        <li><button id="logout-btn" class="btn btn-danger btn-sm">Logout</button></li>
      </ul>
    </div>
  </nav>

  <!-- Dashboard Header -->
  <div class="dashboard-header">
    <div class="container">
      <div class="dashboard-title">👨‍⚖️ Lawyer Dashboard</div>
      <p id="lawyer-greeting" style="margin: 0; opacity: 0.9;"></p>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">
    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">Total Requests</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-pending">0</div>
        <div class="stat-label">Pending</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-accepted">0</div>
        <div class="stat-label">Accepted</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-messages">0</div>
        <div class="stat-label">Messages</div>
      </div>
    </div>

    <!-- Tabs -->
    <div style="background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); overflow: hidden;">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchLawyerTab('pending')">📨 Pending Requests</button>
        <button class="tab-btn" onclick="switchLawyerTab('all')">📋 All Requests</button>
        <button class="tab-btn" onclick="switchLawyerTab('messages')">💬 Messages</button>
      </div>

      <!-- Pending Requests Tab -->
      <div id="pending-tab" class="tab-content active">
        <div style="padding: var(--spacing-lg);">
          <div id="pending-container"></div>
        </div>
      </div>

      <!-- All Requests Tab -->
      <div id="all-tab" class="tab-content">
        <div style="padding: var(--spacing-lg);">
          <div id="all-container"></div>
        </div>
      </div>

      <!-- Messages Tab -->
      <div id="messages-tab" class="tab-content">
        <div style="padding: var(--spacing-lg);">
          <div id="messages-container"></div>
          <div id="messages-empty" class="empty-state" style="display: none;">
            <div class="empty-icon">💬</div>
            <p>No messages yet. Accept a request to start chatting with clients.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Chat Modal -->
  <div id="chat-modal" class="modal">
    <div style="background: var(--white); border-radius: var(--radius-lg); width: 90%; max-width: 600px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: var(--shadow-xl);">
      <!-- Chat Header -->
      <div style="padding: var(--spacing-lg); border-bottom: 1px solid var(--gray-200); display: flex; justify-content: space-between; align-items: center;">
        <h3 id="chat-header" style="margin: 0;"></h3>
        <button onclick="closeChatModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">×</button>
      </div>

      <!-- Messages -->
      <div id="chat-messages" style="flex: 1; overflow-y: auto; padding: var(--spacing-lg); display: flex; flex-direction: column; gap: var(--spacing-md);"></div>

      <!-- Input -->
      <div style="padding: var(--spacing-lg); border-top: 1px solid var(--gray-200); display: flex; gap: var(--spacing-md);">
        <input type="text" id="message-input" placeholder="Type your message..." style="flex: 1;" />
        <button onclick="sendChatMessage()" class="btn btn-primary">Send</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <div class="footer-section">
        <h4>AegisVault</h4>
        <p>Professional lawyer client platform.</p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2024 AegisVault. All rights reserved.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="./app.js"></script>
  <script src="./chat.js"></script>
  <script>
    // Lawyer Dashboard Specific Logic
    let currentUser = null;
    let selectedRequest = null;
    let selectedConversation = null;

    document.addEventListener('DOMContentLoaded', () => {
      currentUser = getCurrentUser();

      if (!currentUser || currentUser.role !== 'lawyer') {
        window.location.href = './index.html';
        return;
      }

      initializeLawyerDashboard();
    });

    function initializeLawyerDashboard() {
      document.getElementById('lawyer-greeting').textContent = 
        `Welcome back, ${currentUser.name}! Here are your requests.`;

      loadLawyerStats();
      loadPendingRequests();
      loadAllRequests();
      loadLawyerMessages();

      document.getElementById('logout-btn').addEventListener('click', () => {
        logoutUser();
        window.location.href = './index.html';
      });
    }

    function loadLawyerStats() {
      const requests = getUserRequests(currentUser.id, 'lawyer');
      const messages = getAllMessages();
      const lawyerMessages = messages.filter(m => m.receiverId === currentUser.id && !m.read);

      document.getElementById('stat-total').textContent = requests.length;
      document.getElementById('stat-pending').textContent = requests.filter(r => r.status === 'pending').length;
      document.getElementById('stat-accepted').textContent = requests.filter(r => r.status === 'accepted').length;
      document.getElementById('stat-messages').textContent = lawyerMessages.length;
    }

    function loadPendingRequests() {
      const container = document.getElementById('pending-container');
      const requests = getUserRequests(currentUser.id, 'lawyer')
        .filter(r => r.status === 'pending')
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      container.innerHTML = '';

      if (requests.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><p>No pending requests</p></div>';
        return;
      }

      requests.forEach(request => {
        const client = getUserById(request.clientId);
        const card = document.createElement('div');
        card.className = 'request-card';
        card.innerHTML = `
          <div class="request-header">
            <div class="request-client">From: ${client?.name || 'Unknown Client'}</div>
            <span class="request-status status-pending">Pending</span>
          </div>
          <div class="request-time">Sent ${formatDate(request.createdAt)}</div>
          <div class="request-description">${escapeHtml(request.description)}</div>
          <div class="request-actions">
            <button class="btn btn-success" onclick="acceptRequest('${request.requestId}', '${client.id}', '${client.name}')">
              ✓ Accept
            </button>
            <button class="btn btn-danger" onclick="rejectRequest('${request.requestId}')">
              ✕ Reject
            </button>
            <button class="btn btn-outline" onclick="viewRequestDetails('${request.requestId}')">
              View Details
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function loadAllRequests() {
      const container = document.getElementById('all-container');
      const requests = getUserRequests(currentUser.id, 'lawyer')
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      container.innerHTML = '';

      if (requests.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><p>No requests yet</p></div>';
        return;
      }

      requests.forEach(request => {
        const client = getUserById(request.clientId);
        const statusClass = `status-${request.status}`;
        const card = document.createElement('div');
        card.className = 'request-card';
        card.innerHTML = `
          <div class="request-header">
            <div class="request-client">From: ${client?.name || 'Unknown Client'}</div>
            <span class="request-status ${statusClass}">${request.status}</span>
          </div>
          <div class="request-time">Sent ${formatDate(request.createdAt)}</div>
          <div class="request-description">${escapeHtml(request.description)}</div>
          <div class="request-actions">
            ${request.status === 'accepted' ? `
              <button class="btn btn-primary" onclick="openLawyerChat('${request.clientId}', '${client.name}', '${request.requestId}')">
                💬 Chat with Client
              </button>
            ` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function loadLawyerMessages() {
      const container = document.getElementById('messages-container');
      const emptyDiv = document.getElementById('messages-empty');
      const allMessages = getAllMessages();
      const lawyerConversations = {};

      // Group messages by client
      allMessages
        .filter(m => m.receiverId === currentUser.id || m.senderId === currentUser.id)
        .forEach(msg => {
          const otherUserId = msg.senderId === currentUser.id ? msg.receiverId : msg.senderId;
          if (!lawyerConversations[otherUserId]) {
            lawyerConversations[otherUserId] = [];
          }
          lawyerConversations[otherUserId].push(msg);
        });

      container.innerHTML = '';

      if (Object.keys(lawyerConversations).length === 0) {
        emptyDiv.style.display = 'block';
        return;
      }

      emptyDiv.style.display = 'none';

      Object.entries(lawyerConversations).forEach(([clientId, messages]) => {
        const client = getUserById(clientId);
        const lastMessage = messages[messages.length - 1];
        const unreadCount = messages.filter(m => m.receiverId === currentUser.id && !m.read).length;

        const conversationDiv = document.createElement('div');
        conversationDiv.className = 'request-card';
        conversationDiv.innerHTML = `
          <div class="request-header">
            <div>
              <div class="request-client">${client?.name || 'Unknown Client'}</div>
              <div class="text-muted text-sm">${lastMessage.text}</div>
            </div>
            ${unreadCount > 0 ? `<span class="badge badge-danger">${unreadCount}</span>` : ''}
          </div>
          <button class="btn btn-primary btn-block" onclick="openLawyerChat('${clientId}', '${client.name}', '')">
            Open Conversation
          </button>
        `;
        container.appendChild(conversationDiv);
      });
    }

    function acceptRequest(requestId, clientId, clientName) {
      try {
        updateRequestStatus(requestId, 'accepted');
        loadLawyerStats();
        loadPendingRequests();
        loadAllRequests();
        alert(`✓ Request accepted! You can now chat with ${clientName}`);
      } catch (error) {
        alert(`Error: ${error.message}`);
      }
    }

    function rejectRequest(requestId) {
      if (confirm('Are you sure you want to reject this request?')) {
        try {
          updateRequestStatus(requestId, 'rejected');
          loadLawyerStats();
          loadPendingRequests();
          loadAllRequests();
          alert('Request rejected');
        } catch (error) {
          alert(`Error: ${error.message}`);
        }
      }
    }

    function viewRequestDetails(requestId) {
      const request = getRequestById(requestId);
      if (request) {
        alert(`Request Details:\n\nClient: ${getUserById(request.clientId)?.name}\nStatus: ${request.status}\n\nDescription:\n${request.description}`);
      }
    }

    function switchLawyerTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`${tab}-tab`).classList.add('active');
      event.target.classList.add('active');
    }

    function openLawyerChat(clientId, clientName, requestId) {
      selectedConversation = {
        clientId,
        clientName,
        requestId
      };

      document.getElementById('chat-header').textContent = `Chat with ${clientName}`;
      loadLawyerChatMessages(clientId);
      document.getElementById('chat-modal').classList.add('active');
    }

    function loadLawyerChatMessages(clientId) {
      const container = document.getElementById('chat-messages');
      const messages = getConversation(currentUser.id, clientId, selectedConversation.requestId || '');

      container.innerHTML = '';

      if (messages.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--gray-600);">No messages yet. Start the conversation!</div>';
        return;
      }

      messages.forEach(message => {
        const isSent = message.senderId === currentUser.id;
        const div = document.createElement('div');
        div.style.cssText = `display: flex; ${isSent ? 'justify-content: flex-end;' : ''}`;
        div.innerHTML = `
          <div style="background: ${isSent ? 'var(--primary-color)' : 'var(--gray-100)'}; color: ${isSent ? 'white' : 'var(--gray-900)'}; padding: var(--spacing-md); border-radius: var(--radius-lg); max-width: 70%; word-wrap: break-word;">
            ${escapeHtml(message.text)}
            <div style="font-size: 0.75rem; margin-top: var(--spacing-xs); opacity: 0.7;">
              ${formatDate(message.timestamp)}
            </div>
          </div>
        `;
        container.appendChild(div);
        
        if (!isSent && !message.read) {
          markMessageAsRead(message.messageId);
        }
      });

      container.scrollTop = container.scrollHeight;
    }

    function sendChatMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();

      if (!text) return;

      try {
        sendMessage(
          currentUser.id,
          selectedConversation.clientId,
          selectedConversation.requestId,
          text
        );

        input.value = '';
        loadLawyerChatMessages(selectedConversation.clientId);
        loadLawyerMessages();
        loadLawyerStats();
      } catch (error) {
        alert(`Error: ${error.message}`);
      }
    }

    function closeChatModal() {
      document.getElementById('chat-modal').classList.remove('active');
      selectedConversation = null;
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      const today = new Date();
      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);

      if (date.toDateString() === today.toDateString()) {
        return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      } else if (date.toDateString() === yesterday.toDateString()) {
        return 'Yesterday';
      } else {
        return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
